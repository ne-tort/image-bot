services:
  bot:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    env_file: .env
    restart: unless-stopped
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,os;urllib.request.urlopen('https://api.telegram.org/bot'+os.environ['BOT_TOKEN']+'/getMe', timeout=10)"]
      interval: 60s
      timeout: 15s
      retries: 3
    stop_grace_period: 20s

# polling, не webhook: за NAT / Docker Desktop это честный дефолт.
# вебхук добавим, когда появится публичный домен (docs/en/deployment.md).
